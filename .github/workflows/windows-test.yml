name: Windows Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-whisper-test

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-msvc" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tama
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package portable test build
        shell: pwsh
        run: |
          $portableDir = "src-tauri/target/release/tama-windows-portable"
          $portableZip = "src-tauri/target/release/Tama-Windows-Whisper-Test-$($env:GITHUB_SHA.Substring(0, 7)).zip"
          New-Item -ItemType Directory -Force "$portableDir/resources"
          Copy-Item "src-tauri/target/release/tama-desktop.exe" "$portableDir/tama-desktop.exe"
          Copy-Item "src-tauri/resources/silero_vad.onnx" "$portableDir/resources/silero_vad.onnx"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$portableZip" -Force

      - name: Upload private test build
        uses: actions/upload-artifact@v4
        with:
          name: tama-windows-whisper-test-${{ github.sha }}
          path: |
            src-tauri/target/release/Tama-Windows-Whisper-Test-*.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
